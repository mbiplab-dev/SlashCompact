[project]
name = "altimap"
version = "0.1.0"
description = "Single-view optical imagery to metric elevation models"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.1",
    "rasterio>=1.4",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "pillow>=10.4",
    "pyproj>=3.7",
    "trimesh>=4.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "laspy>=2.5",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
]

[project.scripts]
altimap = "altimap.cli:main"
altimap-serve = "altimap.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx2>=0.28"]
ml = ["torch>=2.5", "torchvision>=0.20", "timm>=1.0", "transformers>=4.49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altimap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access to Planetary Computer",
]
